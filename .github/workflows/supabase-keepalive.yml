name: Supabase keep-alive

# Holder gratis-Supabase-projektet vågent: free tier pauser projektet efter
# 7 dages inaktivitet, så vi pinger REST-API'et to gange om ugen.
on:
  schedule:
    - cron: '23 6 * * 1,4' # mandag og torsdag kl. 06:23 UTC
  workflow_dispatch: {}

permissions:
  actions: write

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Ping Supabase REST API
        run: |
          URL=$(grep -o "https://[a-z0-9]*\.supabase\.co" src/lib/supabase.ts | head -1)
          KEY=$(grep "supabaseAnonKey" src/lib/supabase.ts | grep -o "'[^']*'" | tr -d "'" | tail -1)
          echo "Pinger $URL ..."
          curl --fail --silent --show-error --retry 3 --retry-delay 10 \
            "$URL/rest/v1/customers?select=id&limit=1" \
            -H "apikey: $KEY" \
            -H "Authorization: Bearer $KEY" \
            -o /dev/null
          echo "Supabase svarede - projektet er aktivt"

      - name: Hjælp ved fejl
        if: failure()
        run: |
          echo "::error::Supabase svarede ikke - projektet er formentlig sat på pause. Gendan det manuelt i dashboardet: https://supabase.com/dashboard/project/jxyzrkrfbkrsdkmjqxwy - derefter holder dette workflow det vaagent."

      # GitHub slår scheduled workflows fra efter 60 dages inaktivitet i
      # repoet; dette kald nulstiller den timer ved hver kørsel.
      - name: Hold workflowet aktivt
        run: |
          curl --fail --silent --show-error -X PUT \
            -H "Authorization: Bearer ${{ github.token }}" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${{ github.repository }}/actions/workflows/supabase-keepalive.yml/enable"
